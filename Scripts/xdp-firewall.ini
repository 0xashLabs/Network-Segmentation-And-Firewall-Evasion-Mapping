[Unit]
Description=Attach XDP firewall to vmbr0
After=network-online. target
Wants=network-online. target

[Service]
Type=oneshot
ExecStart=/usr/sbin/ip link set dev vmbr0 xdp obj /root/eBPF-Firewall.o sec xdp
ExecStop=/usr/sbin/ip link set dev vmbr0 xdp off
RemainAfterExit=yes

[Install]
WantedBy=multi-user. target